# =============================================================
# Configuracion de Cucumber leida desde el classpath.
#
# ATENCION: el motor de JUnit Platform solo toma de este archivo el glue y los filtros.
# La clave cucumber.plugin NO se honra aqui (comprobado: los reportes no se generan).
# Los plugins estan declarados en el POM como system property:
#   pom.xml > surefire > systemPropertyVariables > cucumber.plugin
#
# Comandos utiles:
#   mvn test                                  suite @smoke
#   mvn test -Dcucumber.filter.tags="@critical"
#   mvn test -Dcucumber.execution.parallel.enabled=true
#   mvn test -P rerun                         reejecuta target/rerun.txt
# =============================================================

# Glue: donde viven los Step Definitions, los hooks y el puente con Spring.
cucumber.glue=com.casino.qa,io.cucumber.spring

# Sin publicacion a Cucumber Cloud (requisito del reto: ejecucion local).
cucumber.publish.quiet=true
cucumber.publish.enabled=false

# Ejecucion por defecto en la suite @smoke.
cucumber.filter.tags=@smoke